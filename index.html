<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      ⚠️ `maximum-scale=1, user-scalable=no` 不能省。
      Surface 触屏上浏览器的「双击缩放」会跟我们的画笔抢手势 —— 表现为
      快速点两下页面就缩放了，笔画却没画上。PDF 缩放由我们自己实现
      （Ctrl+滚轮 / 双指捏合），浏览器那套必须关掉。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16181d" />
    <meta name="description" content="轻量 PDF 阅读 + 批注编辑器" />

    <!-- 可安装为桌面应用（Edge / Chrome：「安装此站点为应用」） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="edge-pdf-lite" />

    <title>edge-pdf-lite</title>
  </head>
  <body>
    <!--
      图标 sprite：全局定义一次，组件里用 <Icon name="xxx" /> 引用。
      放在这里而不是某个 .vue 里，是为了避免每个组件各渲染一份 symbol。
      ⚠️ 新增图标要同步加进 src/viewer/Icon.vue 的 ICON_NAMES，
         否则类型检查不会报错、但运行时什么都不显示（最难查的一类 bug）。
    -->
    <!--
      ⚠️ 用 class 隐藏，**不要给这个 svg 加内联 style 属性**。
      内联 style 属性属于 CSP 的 `style-src-attr`，为了让那一行通过就得给整站开
      `'unsafe-inline'` —— 那等于把 CSP 对样式的防护全关掉，代价远大于收益。
      （本来也不用太担心闪烁：里面只有 <symbol>，而 symbol 不渲染。）
    -->
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z" /><path d="M13 3v5h5" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="M16 16l5 5" /></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" /><rect x="13" y="4" width="7" height="7" /><rect x="4" y="13" width="7" height="7" /><rect x="13" y="13" width="7" height="7" /></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" /></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" /><path d="M8 8V4h12v12h-4" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-fitw" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1" /><path d="M3 12h18" /></symbol>
      <symbol id="i-fitp" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1" /><path d="M12 3v18" /></symbol>
      <symbol id="i-single" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="1" /></symbol>
      <symbol id="i-dual" viewBox="0 0 24 24"><rect x="2" y="3" width="9" height="18" rx="1" /><rect x="13" y="3" width="9" height="18" rx="1" /></symbol>
      <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 3l13 7-6 1.5 2.5 6-2.2 1-2.6-6L5 16z" /></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 013 0v6V4.5a1.5 1.5 0 013 0V12V6a1.5 1.5 0 013 0v7a6 6 0 01-6 6h-1a5 5 0 01-5-5v-4z" /></symbol>
      <symbol id="i-grab" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 013 0V11m0-1V4.5a1.5 1.5 0 013 0V11m0-1V6.5a1.5 1.5 0 013 0V13a6 6 0 01-6 6h-1a5 5 0 01-5-5v-3z" /></symbol>
      <symbol id="i-highlight" viewBox="0 0 24 24"><path d="M4 20h16" /><path d="M8 16l3-8 3 8z" /></symbol>
      <symbol id="i-underline" viewBox="0 0 24 24"><path d="M7 4v7a5 5 0 0010 0V4" /><path d="M5 20h14" /></symbol>
      <symbol id="i-strike" viewBox="0 0 24 24"><path d="M8 7a4 4 0 018 0 3 3 0 01-3 4" /><path d="M16 17a4 4 0 01-8 0" /><path d="M4 12h16" /></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z" /><path d="M14 6l3 3" /></symbol>
      <symbol id="i-area" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" fill="currentColor" opacity=".35" stroke="none" /><rect x="4" y="6" width="16" height="12" /></symbol>
      <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" /></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M12 6v13" /></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8 20h11" /><path d="M15.5 4.5l5 5-9.5 9.5H6l-2.5-2.5z" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 10H5V6" /><path d="M5 10a8 8 0 1114 4" /></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 10h4V6" /><path d="M19 10a8 8 0 10-14 4" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" /></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="8" y="4" width="8" height="6" /><circle cx="12" cy="15" r="2" /></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6" /></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>

      <!-- 设置面板用的几个 -->
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" /></symbol>
      <!-- 刷新：开口的环形箭头（顺时针），用来重扫文件夹 -->
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1" /><path d="M20.5 4.5v5.5H15" /></symbol>
      <!-- 文件夹「打开」态：开口的夹子，用来表示"在资源管理器里显示" -->
      <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 8h6l2 2h10v9H3z" /><path d="M3 8l3 11h15" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4A8.5 8.5 0 1 0 20 14.5z" /></symbol>
      <symbol id="i-auto" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M12 3v2M9 21h6" /><path d="M8 12h8" /></symbol>
    </svg>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
